version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      expo:
        patterns: ["expo", "expo-*", "jest-expo", "eslint-config-expo", "react", "react-dom", "react-native", "react-native-*", "@types/react"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
